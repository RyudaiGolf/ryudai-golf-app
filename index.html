<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>琉大医学部ゴルフ部</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; background-color: #f8fafc; color: #333; -webkit-tap-highlight-color: transparent; }
        .tab-btn { transition: all 0.2s ease; }
        .tab-btn.active { color: #047857; font-weight: bold; border-bottom: 2px solid #047857; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Loading Animation */
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(16, 185, 129, 0.2); border-left-color: #10b981; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // ==========================================
        // ⚠️ Firebase設定 (Vercelデプロイ用)
        // ==========================================
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY_HERE",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        // 環境変数からFirebase設定を読み込む（Vercel用）
        if (typeof process !== 'undefined' && process.env.REACT_APP_FIREBASE_API_KEY) {
             firebaseConfig.apiKey = process.env.REACT_APP_FIREBASE_API_KEY;
             firebaseConfig.authDomain = process.env.REACT_APP_FIREBASE_AUTH_DOMAIN;
             firebaseConfig.projectId = process.env.REACT_APP_FIREBASE_PROJECT_ID;
             firebaseConfig.storageBucket = process.env.REACT_APP_FIREBASE_STORAGE_BUCKET;
             firebaseConfig.messagingSenderId = process.env.REACT_APP_FIREBASE_MESSAGING_SENDER_ID;
             firebaseConfig.appId = process.env.REACT_APP_FIREBASE_APP_ID;
        }

        // Firebase初期化 (まだ初期化されていなければ)
        if (!firebase.apps.length) {
            // apiKeyがデフォルトのままなら初期化をスキップするか警告を出す
            if (firebaseConfig.apiKey === "YOUR_API_KEY_HERE") {
                console.warn("Firebase config is not set. Data will not be saved.");
                // 簡易的なモックDBオブジェクトを作成 (UIがエラーで落ちないようにするため)
                window.db = {
                    collection: () => ({
                        onSnapshot: (cb) => { cb({ forEach: ()=>{} }); return ()=>{}; },
                        doc: () => ({ set: async ()=>{}, update: async ()=>{}, delete: async ()=>{} })
                    })
                };
            } else {
                firebase.initializeApp(firebaseConfig);
                window.db = firebase.firestore();
            }
        } else {
            window.db = firebase.firestore();
        }

        const { useState, useEffect } = React;

        // アイコン定義 (Lucideの代わりにSVGを直接描画)
        const Icons = {
            Golf: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="4"></circle><path d="M12 16v6"></path><path d="M9 22h6"></path><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"></path></svg>,
            Calendar: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>,
            CheckSquare: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>,
            TrendingUp: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>,
            Users: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>,
            LogOut: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>,
            Settings: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33h.09a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>,
            AlertCircle: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>,
            Star: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>,
            UserPlus: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>,
            Trash2: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>,
            ChevronDown: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="6 9 12 15 18 9"></polyline></svg>,
            ChevronUp: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="18 15 12 9 6 15"></polyline></svg>,
            MessageCircle: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>,
            X: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
            Flag: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><line x1="4" y1="22" x2="4" y2="15"></line></svg>,
            Banknote: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="2" y="6" width="20" height="12" rx="2"></rect><circle cx="12" cy="12" r="2"></circle><path d="M6 12h.01M18 12h.01"></path></svg>,
            Bell: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>,
            Edit: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
        };

        const App = () => {
            // ==========================================
            // ステート管理
            // ==========================================
            const [isFirebaseReady, setIsFirebaseReady] = useState(false);
            const [currentUser, setCurrentUser] = useState(null);
            
            // データ格納用ステート
            const [users, setUsers] = useState({});
            const [attendance, setAttendance] = useState({});
            const [votes, setVotes] = useState({});
            const [practiceRecords, setPracticeRecords] = useState({});
            const [messages, setMessages] = useState([]);
            const [customEvents, setCustomEvents] = useState([]);
            const [eventAttendance, setEventAttendance] = useState({});
            const [scheduleEvents, setScheduleEvents] = useState([]);
            const [advances, setAdvances] = useState([]);

            // UIステート
            const [activeTab, setActiveTab] = useState('events'); 
            const [showLoginMessages, setShowLoginMessages] = useState(false);
            const [showPopupMessages, setShowPopupMessages] = useState(false);
            const [showAdvanceModal, setShowAdvanceModal] = useState(false);
            const [hasSeenPopup, setHasSeenPopup] = useState(false);
            const [expandedEvent, setExpandedEvent] = useState({});
            const [selectedVoteMonth, setSelectedVoteMonth] = useState('2026-08');
            const [selectedVoteDay, setSelectedVoteDay] = useState(null);
            const [showWarningModal, setShowWarningModal] = useState(false);
            
            // アコーディオン開閉
            const [isDailyAttExpanded, setIsDailyAttExpanded] = useState(true);
            const [isMonthlyStatsExpanded, setIsMonthlyStatsExpanded] = useState(true);

            // 入力用ステート
            const [loginId, setLoginId] = useState('');
            const [loginPass, setLoginPass] = useState('');
            const [loginError, setLoginError] = useState('');
            const [reason, setReason] = useState('');
            
            // 自主練記録用
            const [practicePlace, setPracticePlace] = useState('西原グリーンセンター');
            const [practiceHours, setPracticeHours] = useState('1');
            const [practiceScore, setPracticeScore] = useState('');

            // 管理者機能用
            const [newUserName, setNewUserName] = useState('');
            const [newUserPass, setNewUserPass] = useState('');
            const [newMsgContent, setNewMsgContent] = useState('');
            const [newMsgPopup, setNewMsgPopup] = useState(false);
            const [editingUser, setEditingUser] = useState(null);
            const [editUserName, setEditUserName] = useState('');
            const [editUserPass, setEditUserPass] = useState('');

            // 特別イベント関連
            const [newEventTitle, setNewEventTitle] = useState('');
            const [newEventDate, setNewEventDate] = useState('');
            const [newEventTime, setNewEventTime] = useState('');
            const [newEventLoc, setNewEventLoc] = useState('');
            const [newEventDesc, setNewEventDesc] = useState('');

            // 建て替え記録関連
            const [advEventId, setAdvEventId] = useState('');
            const [advHeadcount, setAdvHeadcount] = useState('');
            const [advAmount, setAdvAmount] = useState('');
            const [advEditingId, setAdvEditingId] = useState(null); 

            // 練習枠追加関連
            const [newScheduleDate, setNewScheduleDate] = useState('');
            const [newScheduleTime, setNewScheduleTime] = useState('');
            const [newScheduleType, setNewScheduleType] = useState('希望参加');
            const [newScheduleLabel, setNewScheduleLabel] = useState('');

            // ==========================================
            // Firebase データ監視 (リアルタイム)
            // ==========================================
            useEffect(() => {
                let unsubs = [];
                if (window.db && typeof window.db.collection === 'function') {
                    try {
                        unsubs.push(db.collection('users').onSnapshot(snap => {
                            const d = {}; snap.forEach(doc => d[doc.id] = doc.data()); setUsers(d);
                        }));
                        unsubs.push(db.collection('attendance').onSnapshot(snap => {
                            const d = {}; snap.forEach(doc => d[doc.id] = doc.data()); setAttendance(d);
                        }));
                        unsubs.push(db.collection('votes').onSnapshot(snap => {
                            const d = {}; snap.forEach(doc => d[doc.id] = doc.data()); setVotes(d);
                        }));
                        unsubs.push(db.collection('practice_records').onSnapshot(snap => {
                            const d = {}; snap.forEach(doc => d[doc.id] = doc.data()); setPracticeRecords(d);
                        }));
                        unsubs.push(db.collection('messages').onSnapshot(snap => {
                            const d = []; snap.forEach(doc => d.push(doc.data())); setMessages(d.sort((a,b)=>b.createdAt.localeCompare(a.createdAt)));
                        }));
                        unsubs.push(db.collection('custom_events').onSnapshot(snap => {
                            const d = []; snap.forEach(doc => d.push(doc.data())); setCustomEvents(d.sort((a,b)=>a.date.localeCompare(b.date)));
                        }));
                        unsubs.push(db.collection('schedule_events').onSnapshot(snap => {
                            const d = []; snap.forEach(doc => d.push(doc.data())); setScheduleEvents(d.sort((a,b)=>a.date.localeCompare(b.date)));
                        }));
                        unsubs.push(db.collection('event_attendance').onSnapshot(snap => {
                            const d = {}; snap.forEach(doc => d[doc.id] = doc.data()); setEventAttendance(d);
                        }));
                        unsubs.push(db.collection('advances').onSnapshot(snap => {
                            const d = []; snap.forEach(doc => d.push(doc.data())); setAdvances(d.sort((a,b)=>b.createdAt.localeCompare(a.createdAt)));
                        }));

                        setIsFirebaseReady(true);
                    } catch (e) {
                        console.error("Firebase connection error:", e);
                    }
                }
                return () => unsubs.forEach(unsub => unsub && unsub());
            }, []);

            // ログイン監視とポップアップ
            useEffect(() => {
                if (currentUser && !hasSeenPopup) {
                    const popupMsgs = messages.filter(m => m.showOnLogin);
                    if (popupMsgs.length > 0) {
                        setShowPopupMessages('popupOnly');
                    }
                    setHasSeenPopup(true);
                }
            }, [currentUser, messages, hasSeenPopup]);


            // ==========================================
            // アクション関数
            // ==========================================
            const handleLogin = (e) => {
                e.preventDefault();
                const found = Object.values(users).find(u => u.name === loginId && u.password === loginPass);
                if (found) { setCurrentUser(found); setLoginError(''); }
                else setLoginError('名前またはパスワードが間違っています。');
            };

            const toggleAttendance = async (eventId, currentStatus) => {
                if (!currentUser) return;
                const newStatus = currentStatus === '出席' ? '欠席' : '出席';
                await db.collection('attendance').doc(`${currentUser.id}_${eventId}`).set({
                    userId: currentUser.id, eventId: eventId, status: newStatus, reason: newStatus==='出席' ? '' : '', updatedAt: new Date().toISOString()
                });
            };

            const saveReason = async (eventId) => {
                if (!currentUser) return;
                await db.collection('attendance').doc(`${currentUser.id}_${eventId}`).update({ reason: reason });
                setReason('');
            };

            const toggleEventAttendance = async (eventId, currentStatus) => {
                if (!currentUser) return;
                const newStatus = currentStatus === '参加' ? '不参加' : '参加';
                await db.collection('event_attendance').doc(`${currentUser.id}_${eventId}`).set({
                    userId: currentUser.id, eventId: eventId, status: newStatus, updatedAt: new Date().toISOString()
                });
            };

            const attemptVote = (dayId) => {
                if (!currentUser) return;
                if (['tue', 'thu'].includes(dayId)) setShowWarningModal(true);
                else confirmVote(dayId);
            };

            const confirmVote = async (dayId) => {
                if (!currentUser || !selectedVoteMonth) return;
                
                const exemptCheckbox = document.getElementById(`exempt_${dayId}`);
                const isExempt = exemptCheckbox ? exemptCheckbox.checked : false;

                await db.collection('votes').doc(currentUser.id).set({
                    [selectedVoteMonth]: dayId,
                    [`${selectedVoteMonth}_exempt`]: isExempt,
                    updatedAt: new Date().toISOString()
                }, { merge: true });
                setSelectedVoteDay(null);
                setShowWarningModal(false);
            };

            const savePractice = async (e) => {
                e.preventDefault();
                if (!currentUser) return;
                const id = `prac_${Date.now()}`;
                
                let scoreVal = null;
                const scoreTypes = ['ショートコース', 'ミドルコース', 'ロングコース', 'パークゴルフ'];
                if (scoreTypes.includes(practicePlace) && practiceScore !== '') {
                    scoreVal = parseInt(practiceScore, 10);
                }

                await db.collection('practice_records').doc(id).set({
                    userId: currentUser.id, place: practicePlace, hours: parseInt(practiceHours, 10), score: scoreVal, createdAt: new Date().toISOString()
                });
                setPracticePlace('西原グリーンセンター'); setPracticeHours('1'); setPracticeScore('');
                alert('記録しました！');
            };

            // 建て替え記録のアクション
            const handleRecordAdvance = async (e) => {
                e.preventDefault();
                if (!advEventId || !advHeadcount || !advAmount) return;
                
                const allEvts = [...scheduleEvents, ...customEvents];
                const selectedEvt = allEvts.find(evt => evt.id === advEventId);
                const eventLabel = selectedEvt ? (selectedEvt.label || selectedEvt.title) : advEventId;

                if (advEditingId) {
                    await db.collection('advances').doc(advEditingId).update({
                        eventId: advEventId,
                        eventLabel: eventLabel,
                        headcount: parseInt(advHeadcount, 10),
                        amount: parseInt(advAmount, 10)
                    });
                    setAdvEditingId(null);
                } else {
                    const id = `adv_${Date.now()}`;
                    await db.collection('advances').doc(id).set({
                        id,
                        userId: currentUser.id,
                        eventId: advEventId,
                        eventLabel: eventLabel,
                        headcount: parseInt(advHeadcount, 10),
                        amount: parseInt(advAmount, 10),
                        createdAt: new Date().toISOString()
                    });
                }
                
                setAdvEventId(''); setAdvHeadcount(''); setAdvAmount('');
            };

            const startEditAdvance = (adv) => {
                setAdvEditingId(adv.id);
                setAdvEventId(adv.eventId);
                setAdvHeadcount(adv.headcount.toString());
                setAdvAmount(adv.amount.toString());
            };

            const cancelEditAdvance = () => {
                setAdvEditingId(null);
                setAdvEventId('');
                setAdvHeadcount('');
                setAdvAmount('');
            };

            const deleteAdvance = async (id) => {
                await db.collection('advances').doc(id).delete();
                if (advEditingId === id) cancelEditAdvance();
            };

            // 管理者アクション
            const handleAddUser = async (e) => {
                e.preventDefault();
                const id = `user_${Date.now()}`;
                await db.collection('users').doc(id).set({ id, name: newUserName, password: newUserPass, role: 'user', createdAt: new Date().toISOString() });
                setNewUserName(''); setNewUserPass('');
            };
            
            const handleEditUser = async (e) => {
                e.preventDefault();
                if (editingUser && editUserName && editUserPass) {
                    await db.collection('users').doc(editingUser.id).update({ name: editUserName, password: editUserPass });

                                <h2 className="text-lg font-bold mb-4 flex items-center gap-2 text-emerald-700 border-b pb-2"><Icons.UserPlus className="w-5 h-5" /> 部員の追加</h2>
                                <form onSubmit={handleAddUser} className="flex gap-2">
                                    <input type="text" value={newUserName} onChange={e=>setNewUserName(e.target.value)} placeholder="名前" className="flex-1 p-3 border rounded-xl bg-gray-50 focus:bg-white text-sm outline-none" required />
                                    <input type="text" value={newUserPass} onChange={e=>setNewUserPass(e.target.value)} placeholder="パスワード" className="flex-1 p-3 border rounded-xl bg-gray-50 focus:bg-white text-sm outline-none" required />
                                    <button type="submit" className="bg-emerald-600 text-white font-bold px-6 py-3 rounded-xl hover:bg-emerald-700 transition shadow-sm">追加</button>
                                </form>
                            </div>

                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
                                <h2 className="text-lg font-bold mb-4 flex items-center gap-2 text-emerald-700 border-b pb-2"><Icons.Users className="w-5 h-5" /> 登録ユーザー一覧</h2>
                                <div className="grid gap-2">
                                    {Object.values(users).sort((a,b) => a.role.localeCompare(b.role) || a.name.localeCompare(b.name)).map(user => (
                                        <div key={user.id} className="flex justify-between items-center p-3 bg-gray-50 rounded-xl border border-gray-100 text-sm">
                                            {editingUser && editingUser.id === user.id ? (
                                                <form onSubmit={handleEditUser} className="flex-1 flex gap-2 mr-2">
                                                    <input type="text" value={editUserName} onChange={e=>setEditUserName(e.target.value)} className="flex-1 p-2 border rounded outline-none" required />
                                                    <input type="text" value={editUserPass} onChange={e=>setEditUserPass(e.target.value)} className="flex-1 p-2 border rounded outline-none" required />
                                                    <button type="submit" className="bg-blue-500 text-white px-3 rounded font-bold hover:bg-blue-600">保存</button>
                                                    <button type="button" onClick={() => setEditingUser(null)} className="bg-gray-300 text-gray-700 px-3 rounded font-bold">戻る</button>
                                                </form>
                                            ) : (
                                                <div className="flex items-center gap-3 w-full">
                                                    <span className={`font-bold px-2 py-0.5 rounded text-[10px] ${user.role === 'admin' ? 'bg-amber-100 text-amber-700' : 'bg-gray-200 text-gray-600'}`}>{user.role === 'admin' ? '管理者' : '部員'}</span>
                                                    <span className="font-bold text-gray-800">{user.name}</span>
                                                    <span className="text-gray-400 ml-auto mr-2">PW: {user.password}</span>
                                                    
                                                    <button onClick={() => { setEditingUser(user); setEditUserName(user.name); setEditUserPass(user.password); }} className="text-blue-500 hover:text-blue-700 font-bold text-xs px-2 py-1 bg-blue-50 rounded">編集</button>
                                                    <button onClick={() => db.collection('users').doc(user.id).delete()} className="text-red-400 hover:text-red-600 p-1"><Icons.Trash2 className="w-4 h-4" /></button>
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 建て替えメモ モーダル */}
                    {showAdvanceModal && (() => {
                        const allEvts = [...scheduleEvents, ...customEvents].sort((a,b) => b.date.localeCompare(a.date));
                        const myAdvances = advances.filter(a => a.userId === currentUser.id);

                        return (
                            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                                <div className="bg-white rounded-2xl p-6 max-w-md w-full max-h-[85vh] overflow-y-auto relative shadow-xl">
                                    <button onClick={() => {setShowAdvanceModal(false); cancelEditAdvance();}} className="absolute top-4 right-4 text-gray-400 hover:text-gray-600 bg-gray-100 rounded-full p-1"><Icons.X className="w-5 h-5" /></button>
                                    <h2 className="text-xl font-bold mb-4 flex items-center gap-2 text-emerald-800"><Icons.Banknote className="w-6 h-6" /> 建て替えメモ</h2>
                                    
                                    <form onSubmit={handleRecordAdvance} className="space-y-3 mb-6 bg-emerald-50 p-4 rounded-xl border border-emerald-100">
                                        <h3 className="font-bold text-sm text-emerald-800 mb-2">
                                            {advEditingId ? '記録を更新する' : '新しく記録する'}
                                        </h3>
                                        <div>
                                            <label className="text-xs font-bold text-gray-600 block mb-1">対象の部活・イベント</label>
                                            <select required value={advEventId} onChange={e=>setAdvEventId(e.target.value)} className="w-full p-2.5 text-sm border border-emerald-200 rounded-lg bg-white outline-none focus:ring-2 focus:ring-emerald-500">
                                                <option value="">選択してください</option>
                                                {allEvts.map(evt => (
                                                    <option key={evt.id} value={evt.id}>{evt.date} : {evt.label || evt.title}</option>
                                                ))}
                                            </select>
                                        </div>
                                        <div className="flex gap-3">
                                            <div className="flex-1">
                                                <label className="text-xs font-bold text-gray-600 block mb-1">人数（人分）</label>
                                                <input type="number" required min="1" value={advHeadcount} onChange={e=>setAdvHeadcount(e.target.value)} className="w-full p-2.5 text-sm border border-emerald-200 rounded-lg bg-white outline-none focus:ring-2 focus:ring-emerald-500" placeholder="例: 4" />
                                            </div>
                                            <div className="flex-1">
                                                <label className="text-xs font-bold text-gray-600 block mb-1">合計金額（円）</label>
                                                <input type="number" required min="0" value={advAmount} onChange={e=>setAdvAmount(e.target.value)} className="w-full p-2.5 text-sm border border-emerald-200 rounded-lg bg-white outline-none focus:ring-2 focus:ring-emerald-500" placeholder="例: 2000" />
                                            </div>
                                        </div>
                                        <div className="flex gap-2 pt-2">
                                            <button type="submit" className="flex-1 bg-emerald-600 text-white font-bold py-2.5 rounded-lg hover:bg-emerald-700 transition">
                                                {advEditingId ? '更新する' : '記録する'}
                                            </button>
                                            {advEditingId && (
                                                <button type="button" onClick={cancelEditAdvance} className="px-4 bg-gray-300 text-gray-700 font-bold py-2.5 rounded-lg hover:bg-gray-400 transition">
                                                    キャンセル
                                                </button>
                                            )}
                                        </div>
                                    </form>

                                    <div>
                                        <h3 className="font-bold text-gray-800 mb-3 border-b pb-1">あなたの記録履歴</h3>
                                        <div className="space-y-2">
                                            {myAdvances.length === 0 ? (
                                                <p className="text-xs text-gray-500 text-center py-2">記録はありません</p>
                                            ) : (
                                                myAdvances.map(adv => (
                                                    <div key={adv.id} className={`p-3 border rounded-lg flex justify-between items-center text-sm transition-colors ${advEditingId === adv.id ? 'bg-emerald-100/50 border-emerald-300' : 'bg-gray-50 border-gray-100'}`}>
                                                        <div>
                                                            <div className="font-bold text-gray-800">{adv.eventLabel}</div>
                                                            <div className="text-[10px] text-gray-500">{new Date(adv.createdAt).toLocaleDateString('ja-JP')} 記録</div>
                                                        </div>
                                                        <div className="flex items-center gap-3">
                                                            <div className="text-right">
                                                                <div className="font-bold text-emerald-700">{adv.amount.toLocaleString()}円</div>
                                                                <div className="text-xs text-gray-600">{adv.headcount}人分</div>
                                                            </div>
                                                            <div className="flex flex-col gap-1 border-l pl-2 border-gray-200">
                                                                <button type="button" onClick={() => startEditAdvance(adv)} className="text-gray-400 hover:text-emerald-600 p-1 bg-white rounded-md shadow-sm border border-gray-100"><Icons.Edit className="w-3.5 h-3.5" /></button>
                                                                <button type="button" onClick={() => deleteAdvance(adv.id)} className="text-gray-400 hover:text-red-600 p-1 bg-white rounded-md shadow-sm border border-gray-100"><Icons.Trash2 className="w-3.5 h-3.5" /></button>
                                                            </div>
                                                        </div>
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        );
                    })()}
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
