        const SCORE_TYPES = ['ショートコース', 'ミドルコース', 'ロングコース', 'パークゴルフ'];

        const generateEvents = (dTypes) => {
            const events = [];
            // Target months based on original requirement
            let currentDate = new Date('2026-07-01');
            const endDate = new Date('2026-08-31');
            while (currentDate <= endDate) {
                const dayOfWeek = currentDate.getDay();
                const dateStr = currentDate.toISOString().split('T')[0];
                const monthStr = dateStr.substring(0, 7);
                dTypes.forEach(dt => {
                    if (dt.dayOfWeek === dayOfWeek) {
                        let startTimeStr = '00:00';
                        let endTimeStr = '23:59';
                        const timeMatch = dt.label.match(/(\d{1,2}:\d{2})/g);
                        if (timeMatch && timeMatch.length >= 1) startTimeStr = timeMatch[0];
                        if (timeMatch && timeMatch.length >= 2) endTimeStr = timeMatch[1];
                        else if (dt.label.includes('ショートコース')) endTimeStr = '20:00';

                        const m = currentDate.getMonth() + 1;
                        const d = currentDate.getDate();
                        const dayNames = ['日', '月', '火', '水', '木', '金', '土'];
                        const shortLabel = `${m}/${d}(${dayNames[dayOfWeek]}) ${startTimeStr}${dt.label.includes('ショートコース') ? '〜 ｼｮｰﾄｺｰｽ' : ''}`;
                        const mmdd = `${String(m).padStart(2, '0')}${String(d).padStart(2, '0')}`;

                        events.push({
                            id: `evt_${mmdd}_${dt.id}`, typeId: dt.id, label: shortLabel,
                            date: dateStr, endTime: `${dateStr}T${endTimeStr}:00`, month: monthStr, isVoteable: dt.isVoteable
                        });
                    }
                });
                currentDate.setDate(currentDate.getDate() + 1);
            }
            return events;
        };

        const generatePassword = () => {
            const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            return Array.from({length: 8}).map(() => chars[Math.floor(Math.random() * chars.length)]).join('');
        };

            // Advance edit state
            const [editingAdvanceId, setEditingAdvanceId] = useState(null);

            // Voting state
            const [selectedVoteMonth, setSelectedVoteMonth] = useState('2026-08');

            // Practice state
            const [pracDate, setPracDate] = useState(new Date().toISOString().split('T')[0]);

            const [pracDurationCustom, setPracDurationCustom] = useState('');

            const [newEventLoc, setNewEventLoc] = useState('');
            const [newEventDesc, setNewEventDesc] = useState('');

            // Advance form state
            const [advEventId, setAdvEventId] = useState('');
            const [advHeadcount, setAdvHeadcount] = useState('');
            const [advAmount, setAdvAmount] = useState('');

            // Day type form state
            const [newDayLabel, setNewDayLabel] = useState('');
            const [newDayOfWeek, setNewDayOfWeek] = useState('1');
            const [newDayIsVoteable, setNewDayIsVoteable] = useState(true);

            useEffect(() => {
                const setupFirebase = async () => {
                    try {
                        let userCredential;
                        if (typeof window.__initial_auth_token !== 'undefined') {
                            userCredential = await signInWithCustomToken(auth, window.__initial_auth_token);
                        } else {
                            userCredential = await signInAnonymously(auth);
                        }
                        
                        if (!userCredential.user) return;

                        // Initial check for Admin user
                        const adminDocRef = getDocRef('users', 'カントク');
                        const adminDoc = await getDoc(adminDocRef);
                        
                        if (!adminDoc.exists()) {
                            await setDoc(adminDocRef, { id: 'カントク', name: '監督(管理者)', password: 'admin', role: 'admin' });
                            await setDoc(getDocRef('users', 'ヤマダタロウ'), { id: 'ヤマダタロウ', name: '山田 太郎', password: 'pass', role: 'user' });
                        }
                        
                        setIsFirebaseReady(true);
                    } catch (error) {
                        console.error("Firebase setup error:", error);
                    }
                };
                setupFirebase();
            }, []);

            useEffect(() => {
                if (!isFirebaseReady) return;

                const unsubs = [];
                const errHandler = (err) => console.error("Snapshot error:", err);

                // Settings
                unsubs.push(onSnapshot(getDocRef('settings', 'dayTypes'), (docSnap) => {
                    if (docSnap.exists()) {
                        setDayTypes(docSnap.data().list || DEFAULT_DAY_TYPES);
                    } else {
                        setDoc(getDocRef('settings', 'dayTypes'), { list: DEFAULT_DAY_TYPES });
                    }
                }, errHandler));

                // Read all data regardless of login status (for login messages)
                unsubs.push(onSnapshot(getColRef('messages'), (snap) => {
                    const d = []; snap.forEach(doc => d.push(doc.data())); setMessages(d.sort((a,b)=>b.id.localeCompare(a.id)));
                }, errHandler));

                unsubs.push(onSnapshot(getColRef('users'), (snap) => {
                    const d = {}; snap.forEach(doc => d[doc.id] = doc.data()); setUsers(d);
                }, errHandler));

                // If user is logged in, listen to the rest of the app data
                if (currentUser) {
                    unsubs.push(onSnapshot(getColRef('attendance'), (snap) => {
                        const d = {}; snap.forEach(doc => d[doc.id] = doc.data()); setAttendance(d);
                    }, errHandler));
                    unsubs.push(onSnapshot(getColRef('votes'), (snap) => {
                        const d = {}; snap.forEach(doc => d[doc.id] = doc.data()); setVotes(d);
                    }, errHandler));
                    unsubs.push(onSnapshot(getColRef('holidays'), (snap) => {
                        const d = []; snap.forEach(doc => d.push(doc.data())); setHolidays(d.sort((a,b)=>a.start.localeCompare(b.start)));
                    }, errHandler));
                    unsubs.push(onSnapshot(getColRef('practices'), (snap) => {
                        const d = {}; snap.forEach(doc => d[doc.id] = doc.data().records || []); setPractices(d);
                    }, errHandler));
                    unsubs.push(onSnapshot(getColRef('custom_events'), (snap) => {
                        const d = []; snap.forEach(doc => d.push(doc.data())); setCustomEvents(d.sort((a,b)=>a.date.localeCompare(b.date)));
                    }, errHandler));
                    unsubs.push(onSnapshot(getColRef('event_attendance'), (snap) => {
                        const d = {}; snap.forEach(doc => d[doc.id] = doc.data()); setEventAttendance(d);

                                            <div className="flex-1">
                                                <label className="text-xs font-bold text-emerald-800 block mb-1.5 ml-1">合計金額（円）</label>
                                                <input type="number" required min="0" value={advAmount} onChange={e=>setAdvAmount(e.target.value)} className="w-full p-3 text-sm border border-emerald-200 rounded-xl bg-white outline-none focus:ring-2 focus:ring-emerald-500 shadow-inner transition" placeholder="例: 2000" />
                                            </div>
                                        </div>
                                        <button type="submit" className="w-full bg-emerald-600 text-white font-bold py-3.5 rounded-xl hover:bg-emerald-700 transition shadow-md mt-2">記録する</button>
                                    </form>

                                    <div>
                                        <h3 className="font-bold text-gray-800 mb-4 border-b pb-2 flex items-center gap-2"><Icons.Clock className="w-5 h-5 text-gray-400" />あなたの記録履歴</h3>
                                        <div className="space-y-3">
                                            {myAdvances.length === 0 ? (
                                                <p className="text-xs text-gray-500 text-center py-6 bg-gray-50 rounded-xl">記録はありません</p>
                                            ) : (
                                                myAdvances.map(adv => (
                                                    <div key={adv.id} className="p-4 bg-white border border-gray-200 shadow-sm rounded-xl text-sm transition-all hover:border-emerald-200">
                                                        {editingAdvanceId === adv.id ? (
                                                            <form onSubmit={(e) => handleUpdateAdvance(e, adv.id)} className="space-y-3">
                                                                <div className="font-bold text-emerald-800 text-xs bg-emerald-50 p-2 rounded-lg border border-emerald-100">{adv.eventLabel}</div>
                                                                <div className="flex gap-3">
                                                                    <div className="flex-1">
                                                                        <label className="text-[10px] font-bold text-gray-500 ml-1 block mb-1">人数</label>
                                                                        <input type="number" required min="1" value={editAdvHeadcount} onChange={e=>setEditAdvHeadcount(e.target.value)} className="w-full p-2 border border-gray-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-500" />
                                                                    </div>
                                                                    <div className="flex-1">
                                                                        <label className="text-[10px] font-bold text-gray-500 ml-1 block mb-1">金額(円)</label>
                                                                        <input type="number" required min="0" value={editAdvAmount} onChange={e=>setEditAdvAmount(e.target.value)} className="w-full p-2 border border-gray-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-emerald-500" />
                                                                    </div>
                                                                </div>
                                                                <div className="flex justify-end gap-2 pt-2">
                                                                    <button type="button" onClick={()=>setEditingAdvanceId(null)} className="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg text-xs font-bold hover:bg-gray-200 transition">キャンセル</button>
                                                                    <button type="submit" className="px-5 py-2 bg-emerald-600 text-white rounded-lg text-xs font-bold shadow-sm hover:bg-emerald-700 transition">保存</button>
                                                                </div>
                                                            </form>
                                                        ) : (
                                                            <div className="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3">
                                                                <div>
                                                                    <div className="font-bold text-gray-800 mb-1">{adv.eventLabel}</div>
                                                                    <div className="text-[10px] text-gray-500 font-medium bg-gray-100 px-2 py-0.5 rounded-md inline-block">{new Date(adv.createdAt).toLocaleDateString('ja-JP')} 記録</div>
                                                                </div>
                                                                <div className="flex items-center justify-between sm:justify-end gap-4 shrink-0 bg-gray-50 p-2 rounded-lg border border-gray-100 sm:bg-transparent sm:border-0 sm:p-0">
                                                                    <div className="text-right">
                                                                        <div className="font-bold text-emerald-700 text-lg">{adv.amount.toLocaleString()}<span className="text-xs ml-0.5 text-emerald-600 font-normal">円</span></div>
                                                                        <div className="text-xs text-gray-500 font-medium">{adv.headcount}人分</div>
                                                                    </div>
                                                                    <div className="flex gap-1.5">
                                                                        <button onClick={() => { setEditingAdvanceId(adv.id); setEditAdvHeadcount(adv.headcount); setEditAdvAmount(adv.amount); }} className="text-blue-500 hover:text-blue-700 bg-blue-50 p-2 rounded-lg border border-blue-100 transition" title="編集">
                                                                            <Icons.Edit2 className="w-4 h-4" />
                                                                        </button>
                                                                        <button onClick={() => auth.currentUser && deleteDoc(getDocRef('advances', adv.id))} className="text-red-400 hover:text-red-600 bg-red-50 p-2 rounded-lg border border-red-100 transition" title="削除">
                                                                            <Icons.Trash2 className="w-4 h-4" />
                                                                        </button>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        )}
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        );
                    })()}
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
