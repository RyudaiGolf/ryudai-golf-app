        const DEFAULT_DAY_TYPES = [
            { id: 'mon1', label: '月曜日 17:00-18:30', dayOfWeek: 1, isVoteable: true },
            { id: 'mon2', label: '月曜日 20:00-21:30', dayOfWeek: 1, isVoteable: true },
            { id: 'tue1', label: '火曜日 17:00-18:30', dayOfWeek: 2, isVoteable: true },
            { id: 'thu_short', label: '木曜日 17:30- ショートコース', dayOfWeek: 4, isVoteable: false },
            { id: 'thu1', label: '木曜日 20:00-21:30', dayOfWeek: 4, isVoteable: true },
            { id: 'fri1', label: '金曜日 17:00-18:30', dayOfWeek: 5, isVoteable: true },
            { id: 'sat1', label: '土曜日 9:30-11:00', dayOfWeek: 6, isVoteable: true },
            { id: 'sat2', label: '土曜日 18:30-20:00', dayOfWeek: 6, isVoteable: true }
        ];

        const PRACTICE_TYPES = ['ゴルフレンジ', 'ショートコース', 'ミドルコース', 'ロングコース', 'パークゴルフ'];
        const SCORE_TYPES = ['ショートコース', 'ミドルコース', 'ロングコース', 'パークゴルフ'];

        const generateEvents = (dTypes) => {
            const events = [];
            let currentDate = new Date('2026-07-01');
            const endDate = new Date('2026-08-31');
            while (currentDate <= endDate) {
                const dayOfWeek = currentDate.getDay();
                const dateStr = currentDate.toISOString().split('T')[0];
                const monthStr = dateStr.substring(0, 7);
                dTypes.forEach(dt => {
                    if (dt.dayOfWeek === dayOfWeek) {
                        let startTimeStr = '00:00';
                        let endTimeStr = '23:59';
                        const timeMatch = dt.label.match(/(\d{1,2}:\d{2})/g);
                        if (timeMatch && timeMatch.length >= 1) startTimeStr = timeMatch[0];
                        if (timeMatch && timeMatch.length >= 2) endTimeStr = timeMatch[1];
                        else if (dt.label.includes('ショートコース')) endTimeStr = '20:00';

                        const m = currentDate.getMonth() + 1;
                        const d = currentDate.getDate();
                        const dayNames = ['日', '月', '火', '水', '木', '金', '土'];
                        const shortLabel = `${m}/${d}(${dayNames[dayOfWeek]}) ${startTimeStr}${dt.label.includes('ショートコース') ? '〜 ｼｮｰﾄｺｰｽ' : ''}`;
                        const mmdd = `${String(m).padStart(2, '0')}${String(d).padStart(2, '0')}`;

                        events.push({
                            id: `evt_${mmdd}_${dt.id}`, typeId: dt.id, label: shortLabel,
                            date: dateStr, endTime: `${dateStr}T${endTimeStr}:00`, month: monthStr, isVoteable: dt.isVoteable
                        });
                    }
                });
                currentDate.setDate(currentDate.getDate() + 1);
            }
            return events;
        };

        const generatePassword = () => {
            const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            return Array.from({length: 8}).map(() => chars[Math.floor(Math.random() * chars.length)]).join('');
        };

            const [advances, setAdvances] = useState([]);

            // UIステート
            const [showLoginMessages, setShowLoginMessages] = useState(false);
            const [showPopupMessages, setShowPopupMessages] = useState(false);
            const [showAdvanceModal, setShowAdvanceModal] = useState(false);
            const [hasSeenPopup, setHasSeenPopup] = useState(false);
            const [expandedMonths, setExpandedMonths] = useState({ '2026-07': false, '2026-08': true });
            const [expandedEvent, setExpandedEvent] = useState(null);
            const [expandedCustomEvent, setExpandedCustomEvent] = useState(null);
            const [isDailyAttExpanded, setIsDailyAttExpanded] = useState(false);
            const [isMonthlyStatsExpanded, setIsMonthlyStatsExpanded] = useState(false);

            // 建て替え編集用
            const [editingAdvanceId, setEditingAdvanceId] = useState(null);
            const [editAdvHeadcount, setEditAdvHeadcount] = useState('');
            const [editAdvAmount, setEditAdvAmount] = useState('');

            // 投票関連
            const [selectedVoteMonth, setSelectedVoteMonth] = useState('2026-08');
            const [selectedVoteDay, setSelectedVoteDay] = useState(null);
            const [isExemptChecked, setIsExemptChecked] = useState(false);
            const [showWarningModal, setShowWarningModal] = useState(false);

            // 自主練関連
            const [pracDate, setPracDate] = useState(new Date().toISOString().split('T')[0]);
            const [pracType, setPracType] = useState('ゴルフレンジ');
            const [pracDurationOption, setPracDurationOption] = useState('60');
            const [pracDurationCustom, setPracDurationCustom] = useState('');
            const [pracScore, setPracScore] = useState('');
            const [pracMessage, setPracMessage] = useState('');

            // 管理者関連
            const [adminSelectedMonth, setAdminSelectedMonth] = useState('2026-08');
            const [newHoliStart, setNewHoliStart] = useState('');
            const [newHoliEnd, setNewHoliEnd] = useState('');
            const [newHoliLabel, setNewHoliLabel] = useState('');
            const [newMsgTitle, setNewMsgTitle] = useState('');
            const [newMsgContent, setNewMsgContent] = useState('');
            const [newMsgShowOnLogin, setNewMsgShowOnLogin] = useState(true);
            const [newMsgShowOnPopup, setNewMsgShowOnPopup] = useState(false);
            const [newUserKana, setNewUserKana] = useState('');
            const [newUserName, setNewUserName] = useState('');
            const [editingUser, setEditingUser] = useState(null);
            const [editUserName, setEditUserName] = useState('');
            const [editUserPass, setEditUserPass] = useState('');
            
            // 特別イベント関連
            const [newEventTitle, setNewEventTitle] = useState('');
            const [newEventDate, setNewEventDate] = useState('');
            const [newEventTime, setNewEventTime] = useState('');
            const [newEventLoc, setNewEventLoc] = useState('');
            const [newEventDesc, setNewEventDesc] = useState('');

            // 建て替え記録関連
            const [advEventId, setAdvEventId] = useState('');
            const [advHeadcount, setAdvHeadcount] = useState('');
            const [advAmount, setAdvAmount] = useState('');

            // 練習枠追加関連
            const [newDayLabel, setNewDayLabel] = useState('');
            const [newDayOfWeek, setNewDayOfWeek] = useState('1');
            const [newDayIsVoteable, setNewDayIsVoteable] = useState(true);

            useEffect(() => {
                let unsubs = [];
                const setupFirebase = async () => {
                    try {
                        const adminDoc = await db.collection('users').doc('カントク').get();
                        if (!adminDoc.exists) {
                            await db.collection('users').doc('カントク').set({ id: 'カントク', name: '監督(管理者)', password: 'admin', role: 'admin' });
                            await db.collection('users').doc('ヤマダタロウ').set({ id: 'ヤマダタロウ', name: '山田 太郎', password: 'pass', role: 'user' });
                        }

                        unsubs.push(db.collection('settings').doc('dayTypes').onSnapshot(doc => {
                            if (doc.exists) {
                                setDayTypes(doc.data().list || DEFAULT_DAY_TYPES);
                            } else {
                                db.collection('settings').doc('dayTypes').set({ list: DEFAULT_DAY_TYPES });
                            }
                        }));

                        unsubs.push(db.collection('users').onSnapshot(snap => {
                            const d = {}; snap.forEach(doc => d[doc.id] = doc.data()); setUsers(d);
                        }));
                        unsubs.push(db.collection('attendance').onSnapshot(snap => {
                            const d = {}; snap.forEach(doc => d[doc.id] = doc.data()); setAttendance(d);
                        }));
                        unsubs.push(db.collection('votes').onSnapshot(snap => {
                            const d = {}; snap.forEach(doc => d[doc.id] = doc.data()); setVotes(d);
                        }));
                        unsubs.push(db.collection('holidays').onSnapshot(snap => {
                            const d = []; snap.forEach(doc => d.push(doc.data())); setHolidays(d.sort((a,b)=>a.start.localeCompare(b.start)));
                        }));
                        unsubs.push(db.collection('practices').onSnapshot(snap => {
                            const d = {}; snap.forEach(doc => d[doc.id] = doc.data().records || []); setPractices(d);
                        }));
                        unsubs.push(db.collection('messages').onSnapshot(snap => {
                            const d = []; snap.forEach(doc => d.push(doc.data())); setMessages(d.sort((a,b)=>b.id.localeCompare(a.id)));
                        }));
                        unsubs.push(db.collection('custom_events').onSnapshot(snap => {
                            const d = []; snap.forEach(doc => d.push(doc.data())); setCustomEvents(d.sort((a,b)=>a.date.localeCompare(b.date)));
                        }));
                        unsubs.push(db.collection('event_attendance').onSnapshot(snap => {
                            const d = {}; snap.forEach(doc => d[doc.id] = doc.data()); setEventAttendance(d);
                        }));
                        unsubs.push(db.collection('advances').onSnapshot(snap => {
                            const d = []; snap.forEach(doc => d.push(doc.data())); setAdvances(d.sort((a,b)=>b.createdAt.localeCompare(a.createdAt)));
                        }));

                        setIsFirebaseReady(true);
                    } catch (error) {
                        console.error(error);
                    }
                };
                setupFirebase();
                return () => unsubs.forEach(unsub => unsub());
            }, []);

            useEffect(() => {
                setScheduleEvents(generateEvents(dayTypes));
            }, [dayTypes]);

            const isEventPast = (endTimeStr) => new Date(endTimeStr) < new Date();
            const isDateInHoliday = (dateStr) => holidays.some(h => dateStr >= h.start && dateStr <= h.end);
            
            const isMandatoryEvent = (userId, event) => {
                if (isDateInHoliday(event.date) || !event.isVoteable) return false;
                return votes[userId]?.[event.month] === event.typeId;
            };

            const getBestScore = (uid, type) => {
                const records = practices[uid] || [];
                const scores = records.filter(p => p.type === type && p.score).map(p => Number(p.score));
                return scores.length > 0 ? Math.min(...scores) : '-';
            };

            const handleLogin = (e) => {
                e.preventDefault();
                setLoginError('');
                const normalizedId = loginId.replace(/\s+/g, '');
                const user = users[normalizedId];
                if (user && user.password === loginPass) {
                    setCurrentUser(user);
                    setActiveTab(user.role === 'admin' ? 'admin_data' : 'events');
                    
                    // 管理者の場合はお知らせポップアップを表示しない
                    if (user.role !== 'admin') {
                        const popupMsgs = messages.filter(m => m.showOnPopup);
                        if (popupMsgs.length > 0 && !hasSeenPopup) {
                            setShowPopupMessages('auto');
                            setHasSeenPopup(true);
                        }
                    }
                } else {
                    setLoginError('IDまたはパスワードが違います');
                }
            };

            const finalizeVote = async () => {
                await db.collection('votes').doc(currentUser.id).set({ 
                    [selectedVoteMonth]: selectedVoteDay,
                    [`${selectedVoteMonth}_exempt`]: isExemptChecked

                                                    const s = attendance[uid]?.[ev.id]?.status;
                                                    const r = attendance[uid]?.[ev.id]?.reason;
                                                    if(s==='出席') atts.push(users[uid].name);
                                                    if(s==='希望出席') hopes.push(users[uid].name);
                                                    if(s==='欠席') abss.push({ name: users[uid].name, reason: r });
                                                });
                                                return (
                                                    <div key={ev.id} className="p-3 border rounded bg-gray-50 text-sm">
                                                        <div className="font-bold border-b pb-1 mb-2">{ev.label}</div>
                                                        <div className="grid grid-cols-3 gap-2">
                                                            <div className="bg-white p-2 rounded border"><div className="text-green-700 font-bold text-xs mb-1">出席: {atts.length}</div><div className="text-[10px] text-gray-600">{atts.join(', ') || '-'}</div></div>
                                                            <div className="bg-white p-2 rounded border"><div className="text-blue-700 font-bold text-xs mb-1">希望: {hopes.length}</div><div className="text-[10px] text-gray-600">{hopes.join(', ') || '-'}</div></div>
                                                            <div className="bg-white p-2 rounded border">
                                                                <div className="text-red-700 font-bold text-xs mb-1">欠席: {abss.length}</div>
                                                                <div className="space-y-1">
                                                                    {abss.length === 0 ? <div className="text-[10px] text-gray-600">-</div> : abss.map((a, i) => (
                                                                        <div key={i} className="text-[10px] text-gray-700 border-b border-gray-100 last:border-0 pb-1">
                                                                            <span className="font-bold">{a.name}</span>
                                                                            {a.reason && <span className="block text-red-600 bg-red-50 p-1 rounded mt-0.5 whitespace-pre-wrap">理由: {a.reason}</span>}
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}
                                </div>

                                {/* 月間活動集計＆ベストスコア */}
                                <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
                                    <h2 className="text-lg font-bold mb-4 flex justify-between items-center border-b pb-2 cursor-pointer" onClick={()=>setIsMonthlyStatsExpanded(!isMonthlyStatsExpanded)}>
                                        <span className="flex items-center gap-2 text-emerald-700"><Icons.BarChart2 className="w-5 h-5" />月間活動集計＆ベストスコア</span>
                                        <div className="flex items-center gap-3">
                                            <select value={adminSelectedMonth} onChange={e=>{e.stopPropagation();setAdminSelectedMonth(e.target.value);}} className="text-sm border p-1 rounded font-bold"><option value="2026-07">2026-07</option><option value="2026-08">2026-08</option></select>
                                            {isMonthlyStatsExpanded ? <Icons.ChevronUp className="w-5 h-5" /> : <Icons.ChevronDown className="w-5 h-5" />}
                                        </div>
                                    </h2>
                                    {isMonthlyStatsExpanded && (
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-xs text-left whitespace-nowrap min-w-[800px]">
                                                <thead className="bg-gray-100 text-gray-600">
                                                    <tr><th className="p-2 sticky left-0 bg-gray-100 shadow-[1px_0_0_0_#e5e7eb]">名前</th><th className="p-2 text-center text-green-700 border-l">出</th><th className="p-2 text-center text-red-700">欠</th><th className="p-2 text-center text-blue-700 border-l">レンジ</th>{SCORE_TYPES.map(t=><th key={t} className="p-2 text-center border-l text-amber-700">{t.substring(0,3)}</th>)}</tr>
                                                </thead>
                                                <tbody className="divide-y divide-gray-100">
                                                    {Object.values(users).filter(u=>u.role==='user').sort((a,b)=>a.id.localeCompare(b.id)).map(u => {
                                                        let attC=0; let absC=0;
                                                        (eventsByMonth[adminSelectedMonth]||[]).forEach(ev => {
                                                            const isMan = isMandatoryEvent(u.id, ev);
                                                            const st = attendance[u.id]?.[ev.id]?.status;
                                                            if(st==='出席'||st==='希望出席'||(isMan&&!st)) attC++;
                                                            if(st==='欠席') absC++;
                                                        });
                                                        const pracs = (practices[u.id]||[]).filter(p=>p.type==='ゴルフレンジ'&&p.date.startsWith(adminSelectedMonth));
                                                        return (
                                                            <tr key={u.id} className="hover:bg-gray-50">
                                                                <td className="p-2 font-bold sticky left-0 bg-white shadow-[1px_0_0_0_#e5e7eb]">{u.name}</td>
                                                                <td className="p-2 text-center border-l bg-green-50/50 font-bold text-green-700">{attC}</td>
                                                                <td className="p-2 text-center bg-red-50/50 font-bold text-red-700">{absC}</td>
                                                                <td className="p-2 text-center border-l bg-blue-50/50 text-blue-700">{pracs.length}回</td>
                                                                {SCORE_TYPES.map(t => <td key={t} className="p-2 text-center border-l font-bold text-gray-700">{getBestScore(u.id, t)}</td>)}
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        </div>
                                    )}
                                </div>

                                {/* 部員の建て替え記録 */}
                                <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
                                    <h2 className="text-lg font-bold mb-4 flex items-center gap-2 text-emerald-700 border-b pb-2"><Icons.Banknote className="w-5 h-5" /> 部員の建て替え記録</h2>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-xs text-left whitespace-nowrap">
                                            <thead className="bg-emerald-50 text-emerald-800">
                                                <tr>
                                                    <th className="p-2 rounded-tl-lg">記録日</th>
                                                    <th className="p-2">部員名</th>
                                                    <th className="p-2">対象イベント・部活</th>
                                                    <th className="p-2 text-right">人数</th>
                                                    <th className="p-2 text-right">金額</th>
                                                    <th className="p-2 text-center rounded-tr-lg">操作</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-gray-100">
                                                {advances.length === 0 ? (
                                                    <tr><td colSpan="6" className="p-4 text-center text-gray-500">記録はありません</td></tr>
                                                ) : (
                                                    advances.map(adv => (
                                                        <tr key={adv.id} className="hover:bg-gray-50">
                                                            <td className="p-2 text-gray-500">{new Date(adv.createdAt).toLocaleDateString('ja-JP')}</td>
                                                            <td className="p-2 font-bold">{users[adv.userId]?.name || '不明なユーザー'}</td>
                                                            <td className="p-2 text-gray-700">{adv.eventLabel}</td>
                                                            <td className="p-2 text-right font-bold">{adv.headcount}人</td>
                                                            <td className="p-2 text-right font-bold text-emerald-700">{adv.amount.toLocaleString()}円</td>
                                                            <td className="p-2 text-center">
                                                                <button onClick={() => db.collection('advances').doc(adv.id).delete()} className="text-red-400 hover:text-red-600 p-1"><Icons.Trash2 className="w-4 h-4" /></button>
                                                            </td>
                                                        </tr>
                                                    ))
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {}
                        {activeTab === 'admin_users' && (
                            <div className="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
                                <h2 className="text-lg font-bold mb-4 border-b pb-2 flex items-center gap-2"><Icons.Users className="w-5 h-5" />部員管理</h2>
                                <form onSubmit={async(e)=>{
                                    e.preventDefault();
                                    const nid = newUserKana.replace(/\s+/g,'');
                                    await db.collection('users').doc(nid).set({ id: nid, name: newUserName, password: generatePassword(), role: 'user' });
                                    setNewUserName(''); setNewUserKana('');
                                }} className="flex gap-2 mb-4">
                                    <input type="text" placeholder="名前" required value={newUserName} onChange={e=>setNewUserName(e.target.value)} className="flex-1 p-2 text-sm border rounded bg-gray-50" />
                                    <input type="text" placeholder="カナ" required value={newUserKana} onChange={e=>setNewUserKana(e.target.value)} className="flex-1 p-2 text-sm border rounded bg-gray-50" />
                                    <button type="submit" className="bg-emerald-600 text-white px-4 rounded font-bold text-sm">追加</button>
                                </form>
                                <div className="space-y-2">
                                    {Object.values(users).sort((a,b)=>a.id.localeCompare(b.id)).map(u => (
                                        <div key={u.id} className="p-3 bg-gray-50 rounded border text-sm flex justify-between items-center">
                                            {editingUser?.id === u.id ? (
                                                <form onSubmit={handleUpdateUser} className="flex-1 flex gap-2 mr-2">
                                                    <input type="text" required value={editUserName} onChange={e=>setEditUserName(e.target.value)} className="flex-1 p-1 border rounded" />
                                                    <input type="text" required value={editUserPass} onChange={e=>setEditUserPass(e.target.value)} className="w-24 p-1 border rounded font-mono text-xs" />
                                                    <button type="submit" className="bg-blue-600 text-white px-2 rounded text-xs font-bold">保存</button>
                                                    <button type="button" onClick={()=>setEditingUser(null)} className="bg-gray-400 text-white px-2 rounded text-xs font-bold">取消</button>
                                                </form>
                                            ) : (
                                                <>
                                                    <div>
                                                        <span className="font-bold mr-2">{u.name}</span>
                                                        <span className="text-xs text-gray-500 font-mono bg-white px-1 border rounded">Pass: {u.password}</span>
                                                    </div>
                                                    <div className="flex gap-2">
                                                        <button onClick={()=>{setEditingUser(u); setEditUserName(u.name); setEditUserPass(u.password);}} className="text-blue-500 p-1"><Icons.Edit2 className="w-4 h-4" /></button>
                                                        {u.role !== 'admin' && <button onClick={()=>db.collection('users').doc(u.id).delete()} className="text-red-400 p-1"><Icons.Trash2 className="w-4 h-4" /></button>}
                                                    </div>
                                                </>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>

                    {}
                    {showPopupMessages && (() => {
                        const displayMsgs = showPopupMessages === 'auto' ? messages.filter(m => m.showOnPopup) : messages;
                        return (
                            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                                <div className="bg-white rounded-2xl p-6 max-w-md w-full max-h-[80vh] overflow-y-auto relative shadow-xl">
                                    <button onClick={() => setShowPopupMessages(false)} className="absolute top-4 right-4 text-gray-400 hover:text-gray-600 bg-gray-100 rounded-full p-1"><Icons.X className="w-5 h-5" /></button>
                                    <h2 className="text-xl font-bold mb-4 flex items-center gap-2 text-emerald-800"><Icons.Bell className="w-6 h-6" /> お知らせ</h2>
                                    <div className="space-y-4">
                                        {displayMsgs.length === 0 ? (
                                            <p className="text-sm text-gray-500 text-center py-4">現在お知らせはありません。</p>
                                        ) : (
                                            displayMsgs.map(msg => (
                                                <div key={msg.id} className="p-4 bg-amber-50 border border-amber-100 rounded-xl relative">
                                                    {msg.showOnPopup && <span className="absolute top-3 right-3 flex h-3 w-3"><span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span><span className="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span></span>}
                                                    <div className="text-xs font-bold text-amber-600 mb-1">{msg.date}</div>
                                                    <div className="font-bold text-gray-800 mb-2 pr-6">{msg.title}</div>
                                                    <div className="text-sm text-gray-700 whitespace-pre-wrap">{msg.content}</div>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            </div>
                        );
                    })()}

                    {}
                    {showAdvanceModal && (() => {
                        const allEvts = [...scheduleEvents, ...customEvents].sort((a,b) => b.date.localeCompare(a.date));
                        const myAdvances = advances.filter(a => a.userId === currentUser.id);

                        return (
                            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                                <div className="bg-white rounded-2xl p-6 max-w-md w-full max-h-[85vh] overflow-y-auto relative shadow-xl">
                                    <button onClick={() => { setShowAdvanceModal(false); setEditingAdvanceId(null); }} className="absolute top-4 right-4 text-gray-400 hover:text-gray-600 bg-gray-100 rounded-full p-1"><Icons.X className="w-5 h-5" /></button>
                                    <h2 className="text-xl font-bold mb-4 flex items-center gap-2 text-emerald-800"><Icons.Banknote className="w-6 h-6" /> 建て替えメモ</h2>
                                    
                                    <form onSubmit={handleRecordAdvance} className="space-y-3 mb-6 bg-emerald-50 p-4 rounded-xl border border-emerald-100">
                                        <h3 className="font-bold text-sm text-emerald-800 mb-2">新しく記録する</h3>
                                        <div>
                                            <label className="text-xs font-bold text-gray-600 block mb-1">対象の部活・イベント</label>
                                            <select required value={advEventId} onChange={e=>setAdvEventId(e.target.value)} className="w-full p-2.5 text-sm border border-emerald-200 rounded-lg bg-white outline-none focus:ring-2 focus:ring-emerald-500">
                                                <option value="">選択してください</option>
                                                {allEvts.map(evt => (
                                                    <option key={evt.id} value={evt.id}>{evt.date} : {evt.label || evt.title}</option>
                                                ))}
                                            </select>
                                        </div>
                                        <div className="flex gap-3">
                                            <div className="flex-1">
                                                <label className="text-xs font-bold text-gray-600 block mb-1">人数（人分）</label>
                                                <input type="number" required min="1" value={advHeadcount} onChange={e=>setAdvHeadcount(e.target.value)} className="w-full p-2.5 text-sm border border-emerald-200 rounded-lg bg-white outline-none focus:ring-2 focus:ring-emerald-500" placeholder="例: 4" />
                                            </div>
                                            <div className="flex-1">
                                                <label className="text-xs font-bold text-gray-600 block mb-1">合計金額（円）</label>
                                                <input type="number" required min="0" value={advAmount} onChange={e=>setAdvAmount(e.target.value)} className="w-full p-2.5 text-sm border border-emerald-200 rounded-lg bg-white outline-none focus:ring-2 focus:ring-emerald-500" placeholder="例: 2000" />
                                            </div>
                                        </div>
                                        <button type="submit" className="w-full bg-emerald-600 text-white font-bold py-2.5 rounded-lg hover:bg-emerald-700 transition">記録する</button>
                                    </form>

                                    <div>
                                        <h3 className="font-bold text-gray-800 mb-3 border-b pb-1">あなたの記録履歴</h3>
                                        <div className="space-y-2">
                                            {myAdvances.length === 0 ? (
                                                <p className="text-xs text-gray-500 text-center py-2">記録はありません</p>
                                            ) : (
                                                myAdvances.map(adv => (
                                                    <div key={adv.id} className="p-3 bg-gray-50 border border-gray-100 rounded-lg text-sm">
                                                        {editingAdvanceId === adv.id ? (
                                                            <form onSubmit={(e) => handleUpdateAdvance(e, adv.id)} className="space-y-2">
                                                                <div className="font-bold text-gray-800 text-xs">{adv.eventLabel}</div>
                                                                <div className="flex gap-2">
                                                                    <div className="flex-1">
                                                                        <label className="text-[10px] text-gray-500">人数</label>
                                                                        <input type="number" required min="1" value={editAdvHeadcount} onChange={e=>setEditAdvHeadcount(e.target.value)} className="w-full p-1 border rounded text-xs" />
                                                                    </div>
                                                                    <div className="flex-1">
                                                                        <label className="text-[10px] text-gray-500">金額(円)</label>
                                                                        <input type="number" required min="0" value={editAdvAmount} onChange={e=>setEditAdvAmount(e.target.value)} className="w-full p-1 border rounded text-xs" />
                                                                    </div>
                                                                </div>
                                                                <div className="flex justify-end gap-2 pt-1">
                                                                    <button type="button" onClick={()=>setEditingAdvanceId(null)} className="px-2 py-1 bg-gray-200 text-gray-700 rounded text-xs font-bold">キャンセル</button>
                                                                    <button type="submit" className="px-3 py-1 bg-emerald-600 text-white rounded text-xs font-bold">保存</button>
                                                                </div>
                                                            </form>
                                                        ) : (
                                                            <div className="flex justify-between items-center">
                                                                <div>
                                                                    <div className="font-bold text-gray-800">{adv.eventLabel}</div>
                                                                    <div className="text-[10px] text-gray-500">{new Date(adv.createdAt).toLocaleDateString('ja-JP')} 記録</div>
                                                                </div>
                                                                <div className="flex items-center gap-3">
                                                                    <div className="text-right">
                                                                        <div className="font-bold text-emerald-700">{adv.amount.toLocaleString()}円</div>
                                                                        <div className="text-xs text-gray-600">{adv.headcount}人分</div>
                                                                    </div>
                                                                    <div className="flex gap-1">
                                                                        <button onClick={() => { setEditingAdvanceId(adv.id); setEditAdvHeadcount(adv.headcount); setEditAdvAmount(adv.amount); }} className="text-blue-500 hover:text-blue-700 p-1" title="編集">
                                                                            <Icons.Edit2 className="w-4 h-4" />
                                                                        </button>
                                                                        <button onClick={() => db.collection('advances').doc(adv.id).delete()} className="text-red-400 hover:text-red-600 p-1" title="削除">
                                                                            <Icons.Trash2 className="w-4 h-4" />
                                                                        </button>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        )}
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        );
                    })()}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
